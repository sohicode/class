<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>학습활동 포트폴리오</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
.wrap{width:100%;max-width:480px}
.title-block{text-align:center;margin:0 0 1.5rem}
.title-block h1{font-size:18px;font-weight:600;margin:0 0 4px;color:#1a1a1a}
.title-block .t-sub{font-size:13px;color:#4a90d9;font-weight:500;margin:0 0 2px}
.title-block .t-extra{font-size:12px;color:#999;margin:0}
.card{background:#fff;border:0.5px solid #ddd;border-radius:16px;padding:2rem}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:#888;margin-bottom:5px}
.field input{width:100%;padding:9px 12px;font-size:14px;border:0.5px solid #ddd;border-radius:8px;outline:none;font-family:inherit;background:#fafaf8}
.field input:focus{border-color:#4a90d9;background:#fff}
button.submit{width:100%;padding:11px;font-size:14px;font-weight:500;cursor:pointer;background:#1a1a1a;color:#fff;border:none;border-radius:8px;margin-top:6px;font-family:inherit}
button.submit:hover{background:#333}
#result{display:none}
.student-name{font-size:17px;font-weight:500;margin:0 0 16px;padding-bottom:14px;border-bottom:0.5px solid #eee}
.all-done{font-size:14px;color:#2e7d4f;background:#f0faf4;border:0.5px solid #b6e8ca;border-radius:8px;padding:12px 16px}
.section{margin-bottom:16px}
.section-title{font-size:13px;font-weight:500;color:#555;margin:0 0 10px;display:flex;align-items:center;gap:6px}
.section-title .count{font-size:16px;font-weight:700;color:#e0513a}
.item-list{list-style:none;margin:0;padding:0}
.item-list li{font-size:13px;padding:7px 10px;background:#fafaf8;border-radius:6px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.item-name{flex:1}
.tag{font-size:11px;font-weight:600;border-radius:4px;padding:2px 7px;white-space:nowrap}
.tag-x  {background:#fde8e8;color:#c0392b}
.tag-tri{background:#fef3e2;color:#b45309}
.tag-miss{background:#f3f4f6;color:#6b7280}
button.back{width:100%;padding:9px;font-size:13px;cursor:pointer;background:transparent;color:#888;border:0.5px solid #ddd;border-radius:8px;margin-top:20px;font-family:inherit}
button.back:hover{background:#f5f5f3;color:#333}
.msg{font-size:13px;border-radius:8px;padding:10px 14px;margin-top:10px;display:none}
.msg.error{background:#fff0f0;border:0.5px solid #f5c0c0;color:#c0392b}
</style>
</head>
<body>
<div class="wrap">
<div class="title-block">
  <h1>학습활동 포트폴리오</h1>
  <p class="t-sub">미완료 시험/과제 확인</p>
  <p class="t-extra">3~5주차(~4/8)</p>
</div>
<div class="card">
  <div id="pwScreen"><div class="field"><label>비밀번호</label><input type="password" id="fPw" placeholder="비밀번호를 입력하세요"/></div><button class="submit" onclick="checkPassword()">입력</button><div class="msg error" id="pwErr"></div></div><div id="mainScreen" style="display:none;">
    <div id="searchForm">
      <div class="field"><label>반</label><input type="text" id="f반" placeholder="예) 8"/></div>
      <div class="field"><label>번호</label><input type="text" id="f번호" placeholder="예) 8"/></div>
      <div class="field"><label>이름</label><input type="text" id="f이름" placeholder="예) 김소희"/></div>
      <div class="field"><label>아이디</label><input type="text" id="f아이디" placeholder="예) shkim@senedu.kr"/></div>
      <button class="submit" onclick="search()">확인하기</button>
      <div class="msg error" id="errMsg"></div>
    </div>
    <div id="result">
      <p class="student-name" id="studentName"></p>
      <div id="resultBody"></div>
      <button class="back" onclick="goBack()">← 다시 검색</button>
    </div>
  </div>
</div>
</div>

const SALT=new TextEncoder().encode('goorm-edu-salt-2025');
const PW_HASH='158a323a7ba44870f23d96f1516dd70aa48e9a72db4ebb026b0a89e212a208ab';async function checkPassword(){const v=document.getElementById('fPw').value;const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));const h=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');if(h===PW_HASH){document.getElementById('pwScreen').style.display='none';document.getElementById('mainScreen').style.display='block';}else{const e=document.getElementById('pwErr');e.style.display='block';e.textContent='비밀번호가 올바르지 않습니다.';}}document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('pwScreen')&&document.getElementById('pwScreen').style.display!=='none')checkPassword();else if(e.key==='Enter')search();});
async function deriveKey(pw){
  const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:SALT,iterations:100000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function hashId(pw){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function decryptRecord(pw,b64){
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const key=await deriveKey(pw);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:bin.slice(0,12)},key,bin.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function search(){
  const v반=document.getElementById('f반').value.trim();
  const v번호=document.getElementById('f번호').value.trim();
  const v이름=document.getElementById('f이름').value.trim();
  const v아이디=document.getElementById('f아이디').value.trim();
  const err=document.getElementById('errMsg');
  err.style.display='none';
  if(!v반||!v번호||!v이름||!v아이디){err.style.display='block';err.textContent='모든 항목을 입력해주세요.';return;}
  const pw=v반+':'+v번호+':'+v이름+':'+v아이디;
  const id=await hashId(pw);
  const entry=ENTRIES.find(e=>e.id===id);
  if(!entry){err.style.display='block';err.textContent='일치하는 학생 정보를 찾을 수 없습니다.';return;}
  try{
    const rec=await decryptRecord(pw,entry.ct);
    showResult(rec);
  }catch{
    err.style.display='block';err.textContent='인증에 실패했습니다. 입력 정보를 다시 확인해주세요.';
  }
}
function classify(items){
  return items.map(function(c){
    if(c.endsWith(' (x)')) return {name:c.slice(0,-4),type:'x',label:'전체결석'};
    if(c.endsWith(' (△)')) return {name:c.slice(0,-4),type:'tri',label:'부분결석'};
    return {name:c,type:'miss',label:'미제출'};
  });
}
function renderList(items){
  return '<ul class="item-list">'+classify(items).map(function(c){
    return '<li><span class="item-name">'+c.name+'</span><span class="tag tag-'+c.type+'">'+c.label+'</span></li>';
  }).join('')+'</ul>';
}
function showResult(rec){
  document.getElementById('searchForm').style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('studentName').textContent=rec.name;
  const ie=rec.incompleteExams||[];
  const it=rec.incompleteTasks||[];
  if(ie.length===0&&it.length===0){
    document.getElementById('resultBody').innerHTML='<div class="all-done">모든 시험과 과제를 완료했습니다. 🎉</div>';
    return;
  }
  let html='';
  if(ie.length>0)html+='<div class="section"><p class="section-title">미완료 시험 - <span class="count">'+ie.length+'개</span></p>'+renderList(ie)+'</div>';
  if(it.length>0)html+='<div class="section"><p class="section-title">미완료 과제 - <span class="count">'+it.length+'개</span></p>'+renderList(it)+'</div>';
  document.getElementById('resultBody').innerHTML=html;
}
function goBack(){
  document.getElementById('result').style.display='none';
  document.getElementById('searchForm').style.display='block';
  document.getElementById('errMsg').style.display='none';
}
</script>
